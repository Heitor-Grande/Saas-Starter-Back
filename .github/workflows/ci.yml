name: Build and Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-tests:
    name: Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: test
      DATABASE_PASSWORD: test
      DATABASE_NAME: saas_starter_test
      JWT_SECRET: jwt-secret-exclusivo-para-testes
      JWT_EXPIRES_IN_SECONDS: "3600"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build application
        run: npm run build
